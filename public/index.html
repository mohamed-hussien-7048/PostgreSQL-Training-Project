<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>إدارة الأشخاص والأرصدة</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1120;color:#edf4ff;font:14px Tahoma,Arial,sans-serif}.c{max-width:900px;margin:auto;padding:16px}.h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}h1,h2{margin:0}h1{font-size:18px}h2{font-size:15px}.s{color:#8fa3bf;font-size:12px;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#34d399}.stats{display:flex;gap:6px;margin-bottom:8px}.stats>div{flex:1;background:#131d30;border:1px solid #26344c;border-radius:6px;padding:8px;font-size:12px}.stats b{display:block;font-size:16px}.panel{background:#131d30;border:1px solid #26344c;border-radius:6px;padding:10px;margin-bottom:8px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:120px}label{display:block;margin-bottom:3px;color:#8fa3bf;font-size:12px}input{width:100%;padding:7px;border:1px solid #26344c;border-radius:4px;background:#0b1425;color:#edf4ff;outline:none}input:focus{border-color:#22d3ee}button{padding:7px 10px;border:0;border-radius:4px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:wait}.primary{background:#22d3ee;color:#06202a}.secondary{background:#26344c;color:#edf4ff}.danger{background:#4a1f30;color:#fda4af}.actions{display:flex;gap:4px}.actions button{padding:4px 7px;font-size:11px}.t{overflow:auto;border:1px solid #26344c;border-radius:4px;margin-top:6px}table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:7px;text-align:right;border-bottom:1px solid #26344c;font-size:12px}th{color:#8fa3bf;font-weight:normal}.balance{color:#34d399;font-weight:700}.message{display:none;margin-bottom:6px;padding:7px;border-radius:4px;font-size:12px}.message.success{display:block;background:#103b32;color:#6ee7b7}.message.error{display:block;background:#451d2a;color:#fda4af}.empty{text-align:center;padding:20px;color:#8fa3bf}.cyan{color:#22d3ee}.green{color:#34d399}.footer{text-align:center;color:#8fa3bf;font-size:11px;padding:6px}</style></head><body><main class=c><header class=h><div><h1>إدارة الأشخاص والأرصدة</h1><div class=s>لوحة تحكم لإدارة البيانات</div></div><div class=s><span class=dot></span>نظام إدارة الحسابات</div></header><section class=stats><div>إجمالي الأشخاص<b class=cyan id=peopleCount>0</b></div><div>إجمالي الأرصدة<b class=green id=totalBalance>0.00</b></div><div>متوسط الرصيد<b id=averageBalance>0.00</b></div></section><div id=message class=message></div><section class=panel><h2 id=formTitle>إضافة شخص جديد</h2><form id=personForm><input type=hidden id=personId><div class=row><div class=field><label for=name>اسم الشخص</label><input id=name maxlength=100 placeholder="اكتب الاسم" required></div><div class=field><label for=balance>الرصيد</label><input id=balance type=number min=0 max=9999999999.99 step=0.01 value=0 required></div><div class=actions><button class=primary id=submitButton>إضافة</button><button class=secondary id=cancelButton type=button hidden>إلغاء</button></div></div></form></section><section class=panel><h2>سجل الأشخاص</h2><div class=t><table><thead><tr><th>#</th><th>الاسم</th><th>الرصيد</th><th>إجراءات</th></tr></thead><tbody id=peopleTable><tr><td colspan=4 class=empty>جارٍ التحميل...</td></tr></tbody></table></div></section><div class=footer>People Management System</div></main><script src="app.js"></script></body></html>
