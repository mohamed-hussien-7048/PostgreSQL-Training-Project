
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأشخاص والأرصدة</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1120;
            --panel: #131d30;
            --border: #26344c;
            --text: #edf4ff;
            --muted: #8fa3bf;
            --primary: #22d3ee;
            --green: #34d399;
            --red: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #15304a 0, transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
        }

        button, input {
            font: inherit;
        }

        .container {
            width: min(1150px, 94%);
            margin: auto;
            padding: 35px 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 9px;
            font-size: clamp(24px, 4vw, 34px);
        }

        .subtitle, .muted {
            color: var(--muted);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px #34d39980;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .card, .panel {
            background: #131d30eF;
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .card {
            padding: 22px;
        }

        .card-label {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .card-value {
            font-size: clamp(21px, 3vw, 30px);
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .cyan {
            color: var(--primary);
        }

        .green {
            color: var(--green);
        }

        .panel {
            padding: 23px;
            margin-bottom: 22px;
        }

        .panel-title {
            margin: 0 0 20px;
            font-size: 19px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        label {
            font-size: 13px;
            color: var(--muted);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 13px 14px;
            color: var(--text);
            background: #0b1425;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            cursor: pointer;
            transition: opacity .2s, transform .2s;
        }

        button:hover {
            opacity: .85;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
            transform: none;
        }

        .primary {
            background: var(--primary);
            color: #06202a;
            font-weight: bold;
        }

        .secondary {
            background: #26344c;
            color: var(--text);
        }

        .danger {
            background: #4a1f30;
            color: #fda4af;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 8px 11px;
            font-size: 12px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 16px 13px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-size: 13px;
            font-weight: normal;
        }

        td {
            font-size: 14px;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .balance {
            color: var(--green);
            font-weight: bold;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #103b32;
            color: #6ee7b7;
        }

        .message.error {
            display: block;
            background: #451d2a;
            color: #fda4af;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: var(--muted);
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 10px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 17px;
            }

            .container {
                padding-top: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <div>
                <h1>إدارة الأشخاص والأرصدة</h1>
                <div class="subtitle">لوحة تحكم لإدارة بيانات الأشخاص وحساباتهم</div>
            </div>

            <div class="status">
                <span class="dot"></span>
                نظام إدارة الحسابات
            </div>
        </header>

        <section class="stats">
            <article class="card">
                <div class="card-label">إجمالي الأشخاص</div>
                <div class="card-value cyan" id="peopleCount">0</div>
            </article>

            <article class="card">
                <div class="card-label">إجمالي الأرصدة</div>
                <div class="card-value green" id="totalBalance">0.00</div>
            </article>

            <article class="card">
                <div class="card-label">متوسط الرصيد</div>
                <div class="card-value" id="averageBalance">0.00</div>
            </article>
        </section>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <section class="panel">
            <h2 class="panel-title" id="formTitle">إضافة شخص جديد</h2>

            <form id="personForm">
                <input type="hidden" id="personId">

                <div class="form-grid">
                    <div class="field">
                        <label for="name">اسم الشخص</label>
                        <input
                            id="name"
                            name="name"
                            type="text"
                            maxlength="100"
                            placeholder="اكتب الاسم بالكامل"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="balance">الرصيد</label>
                        <input
                            id="balance"
                            name="balance"
                            type="number"
                            min="0"
                            max="9999999999.99"
                            step="0.01"
                            value="0"
                            required
                        >
                    </div>

                    <div class="actions">
                        <button class="primary" id="submitButton" type="submit">
                            إضافة الشخص
                        </button>

                        <button
                            class="secondary"
                            id="cancelButton"
                            type="button"
                            hidden
                        >
                            إلغاء التعديل
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2 class="panel-title">سجل الأشخاص</h2>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>الرصيد</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>

                    <tbody id="peopleTable">
                        <tr>
                            <td colspan="4" class="empty">جارٍ تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="footer">
            People Management System · Node.js · Express · PostgreSQL
        </div>
    </main>

    <script>
        const API_URL = "/people";

        const personForm = document.getElementById("personForm");
        const personIdInput = document.getElementById("personId");
        const nameInput = document.getElementById("name");
        const balanceInput = document.getElementById("balance");
        const peopleTable = document.getElementById("peopleTable");
        const submitButton = document.getElementById("submitButton");
        const cancelButton = document.getElementById("cancelButton");
        const formTitle = document.getElementById("formTitle");
        const messageElement = document.getElementById("message");

        let people = [];

        function formatMoney(value) {
            return Number(value).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        async function request(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...options.headers
                }
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "حدث خطأ أثناء تنفيذ العملية");
            }

            return result;
        }

        function showMessage(message, type = "success") {
            messageElement.textContent = message;
            messageElement.className = `message ${type}`;

            if (type === "success") {
                window.setTimeout(() => {
                    messageElement.className = "message";
                }, 3500);
            }
        }

        function updateStatistics() {
            const total = people.reduce(
                (sum, person) => sum + Number(person.balance),
                0
            );

            document.getElementById("peopleCount").textContent = people.length;
            document.getElementById("totalBalance").textContent = formatMoney(total);

            document.getElementById("averageBalance").textContent =
                formatMoney(people.length ? total / people.length : 0);
        }

        function createCell(value, className = "") {
            const cell = document.createElement("td");
            cell.textContent = value;
            cell.className = className;
            return cell;
        }

        function createActionButton(label, className, onClick) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.className = className;
            button.addEventListener("click", onClick);
            return button;
        }

        function renderPeople() {
            peopleTable.replaceChildren();

            if (people.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 4;
                cell.className = "empty";
                cell.textContent = "لا توجد بيانات حتى الآن";

                row.appendChild(cell);
                peopleTable.appendChild(row);
                updateStatistics();
                return;
            }

            people.forEach((person, index) => {
                const row = document.createElement("tr");
                const actionsCell = document.createElement("td");
                const actions = document.createElement("div");

                actions.className = "actions";

                actions.append(
                    createActionButton("تعديل", "secondary", () => editPerson(person)),
                    createActionButton("حذف", "danger", () => deletePerson(person))
                );

                row.append(
                    createCell(index + 1),
                    createCell(person.name),
                    createCell(formatMoney(person.balance), "balance")
                );

                actionsCell.appendChild(actions);
                row.appendChild(actionsCell);
                peopleTable.appendChild(row);
            });

            updateStatistics();
        }

        async function loadPeople() {
            try {
                const result = await request(API_URL);
                people = result.data;
                renderPeople();
            } catch (error) {
                peopleTable.replaceChildren();

                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 4;
                cell.className = "empty";
                cell.textContent = error.message;

                row.appendChild(cell);
                peopleTable.appendChild(row);
                showMessage(error.message, "error");
            }
        }

        function resetForm() {
            personForm.reset();
            personIdInput.value = "";
            balanceInput.value = "0";
            formTitle.textContent = "إضافة شخص جديد";
            submitButton.textContent = "إضافة الشخص";
            cancelButton.hidden = true;
        }

        function editPerson(person) {
            personIdInput.value = person.id;
            nameInput.value = person.name;
            balanceInput.value = Number(person.balance);
            formTitle.textContent = "تعديل بيانات الشخص";
            submitButton.textContent = "حفظ التعديلات";
            cancelButton.hidden = false;

            personForm.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            nameInput.focus();
        }

        async function deletePerson(person) {
            const confirmed = window.confirm(
                `هل أنت متأكد من حذف "${person.name}"؟`
            );

            if (!confirmed) {
                return;
            }

            try {
                await request(`${API_URL}/${person.id}`, {
                    method: "DELETE"
                });

                showMessage("تم حذف الشخص بنجاح");
                await loadPeople();
            } catch (error) {
                showMessage(error.message, "error");
            }
        }

        personForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = nameInput.value.trim();
            const balance = Number(balanceInput.value);
            const id = personIdInput.value;

            if (!name) {
                showMessage("من فضلك أدخل اسم الشخص", "error");
                return;
            }

            if (
                balanceInput.value.trim() === "" ||
                !Number.isFinite(balance) ||
                balance < 0 ||
                balance > 9999999999.99
            ) {
                showMessage("أدخل رصيدًا صحيحًا بين صفر والحد المسموح", "error");
                return;
            }

            submitButton.disabled = true;

            try {
                await request(id ? `${API_URL}/${id}` : API_URL, {
                    method: id ? "PUT" : "POST",
                    body: JSON.stringify({ name, balance })
                });

                showMessage(id ? "تم تعديل البيانات بنجاح" : "تمت إضافة الشخص بنجاح");

                resetForm();
                await loadPeople();
            } catch (error) {
                showMessage(error.message, "error");
            } finally {
                submitButton.disabled = false;
            }
        });

        cancelButton.addEventListener("click", resetForm);

        loadPeople();
    </script>
</body>
</html>
